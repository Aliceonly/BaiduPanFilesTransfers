name: Windows EXE Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test Windows x64
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os; from src.constants import MAIN_VERSION; assert os.environ['RELEASE_TAG'] == 'v' + MAIN_VERSION, 'Tag must match MAIN_VERSION'"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt

      - name: Run regression tests
        run: python -m pytest -q tests src/test.py

      - name: Check Tk and source GUI
        run: python -m scripts.smoke_gui

      - name: Build single-file EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BaiduPanFilesTransfers --icon BaiduPanFilesTransfers.ico --hidden-import tkinter --collect-all ttkbootstrap BaiduPanFilesTransfers.py

      - name: Check packaged EXE startup
        run: |
          $exe = Resolve-Path .\dist\BaiduPanFilesTransfers.exe
          $process = Start-Process -FilePath $exe -WorkingDirectory .\dist -PassThru
          $windowProcess = $null
          try {
            $started = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) {
                throw "Packaged EXE exited before opening its window (exit code $($process.ExitCode))"
              }
              # The onefile bootloader creates a child process that owns the GUI.
              $windowProcess = Get-Process -Name BaiduPanFilesTransfers -ErrorAction SilentlyContinue |
                Where-Object { $_.MainWindowHandle -ne 0 -and $_.MainWindowTitle -match '^BaiduPanFilesTransfers [0-9]' } |
                Select-Object -First 1
              if ($windowProcess) {
                $started = $true
                break
              }
            }
            if (-not $started) { throw "Packaged EXE did not open a window within 60 seconds" }
            Write-Host "Packaged EXE opened its main window successfully"
          } finally {
            if (-not $process.HasExited) {
              if ($windowProcess) { $null = $windowProcess.CloseMainWindow() }
              if (-not $process.WaitForExit(10000)) { taskkill /PID $process.Id /T /F }
            }
          }

      - name: Package release assets
        run: |
          New-Item -ItemType Directory -Path release-assets | Out-Null
          New-Item -ItemType Directory -Path release-package | Out-Null
          New-Item -ItemType Directory -Path release-package\docs | Out-Null
          Copy-Item .\dist\BaiduPanFilesTransfers.exe .\release-assets\
          Copy-Item .\dist\BaiduPanFilesTransfers.exe .\release-package\
          Copy-Item LICENSE, README.md .\release-package\
          Copy-Item .\docs\BUILD_WINDOWS.md .\release-package\docs\
          @(
            "Commit: $env:GITHUB_SHA"
            "Ref: $env:GITHUB_REF"
            "Platform: Windows x64"
            "Python: $(python --version)"
            "Dependencies:"
            (python -m pip freeze)
          ) | Set-Content .\release-package\BUILD_INFO.txt -Encoding utf8
          Copy-Item .\release-package\BUILD_INFO.txt .\release-assets\
          Compress-Archive -Path .\release-package\* -DestinationPath .\release-assets\BaiduPanFilesTransfers-windows-x64.zip
          $checksums = Get-ChildItem .\release-assets -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          ($checksums -join "`n") + "`n" | Set-Content .\release-assets\SHA256SUMS.txt -Encoding ascii -NoNewline

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download Windows assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-x64-release
          path: release-assets

      - name: Verify and publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --title "BaiduPanFilesTransfers $RELEASE_TAG" \
            --notes-file "releases/$RELEASE_TAG.md" \
            --latest
